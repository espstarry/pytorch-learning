<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 30px; font-weight: 700; }
    .name { font-size: 17px; font-weight: 700; }
    .shape { font-size: 15px; fill: #526078; }
    .note { font-size: 14px; fill: #526078; }
    .arrow { stroke: #526078; stroke-width: 3; marker-end: url(#arrow); }
    .cube { stroke: #172033; stroke-width: 1.5; }
    .front { stroke: #172033; stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L10,3 z" fill="#526078"/>
    </marker>
    <linearGradient id="input" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#b9dcff"/><stop offset="1" stop-color="#6da9e8"/>
    </linearGradient>
    <linearGradient id="feature1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c9f2d2"/><stop offset="1" stop-color="#62bf83"/>
    </linearGradient>
    <linearGradient id="feature2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffd6ad"/><stop offset="1" stop-color="#ec9864"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="620" fill="#f8fafc"/>
  <text x="700" y="48" text-anchor="middle" class="title">TinyCNN: Feature Map Shape</text>
  <text x="700" y="78" text-anchor="middle" class="note">平面大小表示 height × width，堆叠厚度表示 channel 数量</text>

  <!-- input: one image plane -->
  <g transform="translate(75 205)">
    <polygon points="24,0 150,0 174,18 48,18" fill="#d8ebff" class="cube"/>
    <polygon points="150,0 174,18 174,142 150,124" fill="#83b7ea" class="cube"/>
    <rect x="24" y="0" width="126" height="124" fill="url(#input)" class="front"/>
    <path d="M49 0v124 M74 0v124 M99 0v124 M124 0v124 M24 25h126 M24 50h126 M24 75h126 M24 100h126" stroke="#ffffff" opacity=".55"/>
    <text x="90" y="162" text-anchor="middle" class="name">Input</text>
    <text x="90" y="185" text-anchor="middle" class="shape">[8, 1, 16, 16]</text>
    <text x="90" y="208" text-anchor="middle" class="note">1 张图像</text>
  </g>

  <line x1="250" y1="270" x2="315" y2="270" class="arrow"/>
  <text x="282" y="246" text-anchor="middle" class="note">Conv 1→8</text>

  <!-- 8 feature maps -->
  <g transform="translate(325 180)">
    <g opacity=".9">
      <rect x="48" y="0" width="126" height="126" fill="#83c997" class="cube"/>
      <rect x="40" y="7" width="126" height="126" fill="#91d4a2" class="cube"/>
      <rect x="32" y="14" width="126" height="126" fill="#a1dfaf" class="cube"/>
      <rect x="24" y="21" width="126" height="126" fill="#b1e8bb" class="cube"/>
      <rect x="16" y="28" width="126" height="126" fill="url(#feature1)" class="front"/>
    </g>
    <text x="85" y="192" text-anchor="middle" class="name">8 feature maps</text>
    <text x="85" y="215" text-anchor="middle" class="shape">[8, 8, 16, 16]</text>
    <text x="85" y="238" text-anchor="middle" class="note">每张 16×16</text>
  </g>

  <line x1="505" y1="270" x2="570" y2="270" class="arrow"/>
  <text x="538" y="246" text-anchor="middle" class="note">MaxPool 2×2</text>

  <!-- 8 smaller feature maps -->
  <g transform="translate(585 210)">
    <g opacity=".9">
      <rect x="34" y="0" width="94" height="94" fill="#83c997" class="cube"/>
      <rect x="27" y="7" width="94" height="94" fill="#91d4a2" class="cube"/>
      <rect x="20" y="14" width="94" height="94" fill="#a1dfaf" class="cube"/>
      <rect x="13" y="21" width="94" height="94" fill="#b1e8bb" class="cube"/>
      <rect x="6" y="28" width="94" height="94" fill="url(#feature1)" class="front"/>
    </g>
    <text x="65" y="164" text-anchor="middle" class="name">8 feature maps</text>
    <text x="65" y="187" text-anchor="middle" class="shape">[8, 8, 8, 8]</text>
    <text x="65" y="210" text-anchor="middle" class="note">空间尺寸减半</text>
  </g>

  <line x1="735" y1="270" x2="800" y2="270" class="arrow"/>
  <text x="768" y="246" text-anchor="middle" class="note">Conv 8→16</text>

  <!-- 16 feature maps -->
  <g transform="translate(815 175)">
    <g opacity=".9">
      <rect x="50" y="0" width="115" height="115" fill="#dd8a5d" class="cube"/>
      <rect x="42" y="7" width="115" height="115" fill="#e69a70" class="cube"/>
      <rect x="34" y="14" width="115" height="115" fill="#efa982" class="cube"/>
      <rect x="26" y="21" width="115" height="115" fill="#f6bd98" class="cube"/>
      <rect x="18" y="28" width="115" height="115" fill="url(#feature2)" class="front"/>
    </g>
    <text x="83" y="190" text-anchor="middle" class="name">16 feature maps</text>
    <text x="83" y="213" text-anchor="middle" class="shape">[8, 16, 8, 8]</text>
    <text x="83" y="236" text-anchor="middle" class="note">通道数翻倍</text>
  </g>

  <line x1="1000" y1="270" x2="1065" y2="270" class="arrow"/>
  <text x="1033" y="246" text-anchor="middle" class="note">MaxPool 2×2</text>

  <!-- final feature maps -->
  <g transform="translate(1080 215)">
    <g opacity=".9">
      <rect x="30" y="0" width="74" height="74" fill="#dd8a5d" class="cube"/>
      <rect x="24" y="6" width="74" height="74" fill="#e69a70" class="cube"/>
      <rect x="18" y="12" width="74" height="74" fill="#efa982" class="cube"/>
      <rect x="12" y="18" width="74" height="74" fill="#f6bd98" class="cube"/>
      <rect x="6" y="24" width="74" height="74" fill="url(#feature2)" class="front"/>
    </g>
    <text x="47" y="140" text-anchor="middle" class="name">16 maps</text>
    <text x="47" y="163" text-anchor="middle" class="shape">[8, 16, 4, 4]</text>
  </g>

  <!-- flatten and output -->
  <line x1="1190" y1="350" x2="1190" y2="435" class="arrow"/>
  <text x="1215" y="397" class="note">Flatten</text>
  <rect x="1100" y="445" width="180" height="55" rx="8" fill="#e5dcff" stroke="#172033" stroke-width="2"/>
  <text x="1190" y="478" text-anchor="middle" class="name">16×4×4 = 256</text>
  <line x1="1100" y1="525" x2="1280" y2="525" class="arrow"/>
  <text x="1190" y="570" text-anchor="middle" class="name">Linear → logits [8, 2]</text>

  <text x="700" y="590" text-anchor="middle" class="note">注意：图中堆叠的平面是示意，不代表真实绘制了全部 8 或 16 个 channel</text>
</svg>
