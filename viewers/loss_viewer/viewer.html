<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loss / Accuracy Viewer</title>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f4f7fb}
*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:28px 20px}
h1{margin:0 0 8px}.drop,.panel{background:#fff;border:1px solid #dce3ed;border-radius:8px;padding:16px}
.drop{border:2px dashed #b8c7d9;display:flex;justify-content:space-between;gap:16px}
button{background:#1d5fa7;color:#fff;border:0;border-radius:6px;padding:9px 14px;font:inherit;cursor:pointer}
.panel{margin-top:16px}#chart{height:500px;margin-top:18px}svg{width:100%;height:100%}
.grid{stroke:#e3e9f1}.axis{stroke:#8b99aa}.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.legend span:before{content:"";display:inline-block;width:18px;height:3px;background:var(--c);margin:0 6px 3px 0}
</style>
</head>
<body><main>
<h1>Loss / Accuracy Viewer</h1>
<p>在同一张图中观察 loss 下降和 accuracy 上升。左轴是 loss，右轴是 accuracy。</p>
<div class="drop" id="drop">拖入 loss JSON，或选择文件 <label><button>选择 JSON</button><input id="file" type="file" accept=".json" hidden></label></div>
<section class="panel"><strong id="title">等待加载训练曲线</strong><div id="chart"></div><div class="legend" id="legend"></div><p id="status">支持 curves 或 points 格式。</p></section>
</main>
<script>
const colors=["#1d5fa7","#e36b35","#2d9b71","#8b5fbf","#d1a52b"];
const file=document.querySelector("#file"),drop=document.querySelector("#drop");
document.querySelector("button").onclick=()=>file.click();
file.onchange=()=>file.files[0]&&read(file.files[0]);
drop.ondragover=e=>e.preventDefault();
drop.ondrop=e=>{e.preventDefault();read(e.dataTransfer.files[0])};
function read(file){const reader=new FileReader();reader.onload=()=>{try{draw(JSON.parse(reader.result))}catch(e){status.textContent="JSON 读取失败："+e.message}};reader.readAsText(file)}
function normalize(data){
  if(data.points){const names=Object.keys(data.points[0]||{}).filter(n=>n!=="step");return{names,series:Object.fromEntries(names.map(n=>[n,data.points.map(p=>[p.step,p[n]])]))}}
  const names=Object.keys(data.curves||{});return{names,series:Object.fromEntries(names.map(n=>[n,data.curves[n].map((v,i)=>[i+1,v])]))}
}
function draw(data){
  const {names,series}=normalize(data);if(!names.length)throw Error("没有找到曲线数据");
  const W=960,H=460,L=68,R=68,T=26,B=52,accuracyNames=names.filter(n=>n.toLowerCase().includes("accuracy")),lossNames=names.filter(n=>!accuracyNames.includes(n));
  const all=names.flatMap(n=>series[n]),xs=all.map(p=>+p[0]),lossValues=lossNames.flatMap(n=>series[n].map(p=>+p[1]));
  const minX=Math.min(...xs),maxX=Math.max(...xs)||1,minY=Math.min(0,...lossValues),maxY=Math.max(...lossValues)||1;
  const x=v=>L+(v-minX)/(maxX-minX||1)*(W-L-R),yLoss=v=>H-B-(v-minY)/(maxY-minY||1)*(H-T-B),yAccuracy=v=>H-B-v*(H-T-B);
  let svg=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=5;i++){const value=minY+(maxY-minY)*i/5;const acc=i/5;svg+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${yLoss(value)}" y2="${yLoss(value)}"/><text x="8" y="${yLoss(value)+4}" font-size="12">${value.toFixed(3)}</text><text x="${W-42}" y="${yAccuracy(acc)+4}" font-size="12">${(acc*100).toFixed(0)}%</text>`}
  svg+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/><line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${H-B}"/><line class="axis" x1="${W-R}" x2="${W-R}" y1="${T}" y2="${H-B}"/><text transform="translate(14 ${H/2}) rotate(-90)" text-anchor="middle">loss</text><text transform="translate(${W-12} ${H/2}) rotate(90)" text-anchor="middle">accuracy</text>`;
  names.forEach((name,index)=>{const color=colors[index%colors.length],accuracy=accuracyNames.includes(name),points=series[name].map(p=>`${x(p[0])},${accuracy?yAccuracy(+p[1]):yLoss(+p[1])}`).join(" ");svg+=`<polyline fill="none" stroke="${color}" stroke-width="3" points="${points}"/>`;series[name].forEach(p=>{const y=accuracy?yAccuracy(+p[1]):yLoss(+p[1]);svg+=`<circle cx="${x(p[0])}" cy="${y}" r="4" fill="${color}"><title>${name} step=${p[0]} value=${(+p[1]).toFixed(5)}</title></circle>`})});
  svg+=`<text x="${W/2}" y="${H-8}" text-anchor="middle">step / epoch</text></svg>`;chart.innerHTML=svg;title.textContent=(data.model||"训练曲线")+" · loss / accuracy";legend.innerHTML=names.map((n,i)=>`<span style="--c:${colors[i%colors.length]}">${n}</span>`).join("");status.textContent=`已加载 ${lossNames.length} 条 loss 曲线和 ${accuracyNames.length} 条 accuracy 曲线。`;
}
</script></body></html>
