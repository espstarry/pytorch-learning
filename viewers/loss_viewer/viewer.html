<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loss Viewer</title>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:28px 20px}.drop,.panel{background:white;border:1px solid #dce3ed;border-radius:8px;padding:16px}.drop{border:2px dashed #b8c7d9;display:flex;justify-content:space-between;gap:16px}.panel{margin-top:16px}button{background:#1d5fa7;color:white;border:0;border-radius:6px;padding:9px 14px;font:inherit;cursor:pointer}#chart{height:480px;margin-top:18px}svg{width:100%;height:100%}.grid{stroke:#e3e9f1}.axis{stroke:#8b99aa}.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}.legend span:before{content:"";display:inline-block;width:18px;height:3px;background:var(--c);margin:0 6px 3px 0}
</style>
</head>
<body><main>
<h1>Loss Viewer</h1><p>观察训练过程中 loss 是否逐步下降。</p>
<div class="drop" id="drop">拖入 loss JSON，或选择文件 <label><button>选择 JSON</button><input id="file" type="file" accept=".json" hidden></label></div>
<section class="panel"><strong id="title">等待加载训练曲线</strong><div id="chart"></div><div class="legend" id="legend"></div><p id="status">支持 curves 或 points 格式。</p></section>
</main>
<script>
const colors=["#1d5fa7","#e36b35","#2d9b71","#8b5fbf","#d1a52b"],file=document.querySelector("#file"),drop=document.querySelector("#drop");
document.querySelector("button").onclick=()=>file.click();file.onchange=()=>file.files[0]&&read(file.files[0]);
drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();read(e.dataTransfer.files[0])};
function read(file){const r=new FileReader();r.onload=()=>{try{draw(JSON.parse(r.result))}catch(e){status.textContent="JSON 读取失败："+e.message}};r.readAsText(file)}
function normalize(data){if(data.points){const names=Object.keys(data.points[0]||{}).filter(n=>n!=="step");return{names,series:Object.fromEntries(names.map(n=>[n,data.points.map(p=>[p.step,p[n]])]))}}const names=Object.keys(data.curves||{});return{names,series:Object.fromEntries(names.map(n=>[n,data.curves[n].map((v,i)=>[i+1,v])]))}}
function draw(data){const {names,series}=normalize(data);if(!names.length)throw Error("没有找到曲线数据");const W=900,H=450,L=64,R=24,T=24,B=48,all=names.flatMap(n=>series[n]),xs=all.map(p=>+p[0]),ys=all.map(p=>+p[1]),minX=Math.min(...xs),maxX=Math.max(...xs)||1,minY=Math.min(0,...ys),maxY=Math.max(...ys)||1,x=v=>L+(v-minX)/(maxX-minX||1)*(W-L-R),y=v=>H-B-(v-minY)/(maxY-minY||1)*(H-T-B);let s=`<svg viewBox="0 0 ${W} ${H}">`;for(let i=0;i<=5;i++){let v=minY+(maxY-minY)*i/5;s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="8" y="${y(v)+4}" font-size="12">${v.toFixed(3)}</text>`}s+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/><line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${H-B}"/>`;names.forEach((n,i)=>{const c=colors[i%colors.length],pts=series[n].map(p=>`${x(p[0])},${y(p[1])}`).join(" ");s+=`<polyline fill="none" stroke="${c}" stroke-width="3" points="${pts}"/>`;series[n].forEach(p=>s+=`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="4" fill="${c}"><title>${n} step=${p[0]} value=${(+p[1]).toFixed(5)}</title></circle>`)});s+=`<text x="${W/2}" y="${H-8}" text-anchor="middle">step / epoch</text><text transform="translate(14 ${H/2}) rotate(-90)" text-anchor="middle">loss</text></svg>`;chart.innerHTML=s;title.textContent=(data.model||"训练曲线")+" · loss";legend.innerHTML=names.map((n,i)=>`<span style="--c:${colors[i%colors.length]}">${n}</span>`).join("");status.textContent=`已加载 ${names.length} 条曲线。悬停圆点查看精确数值。`}
</script></body></html>
